{% extends "staff_v2/base.html" %}
{% load static %}
{% block content %}
<div class="main-wrapper">
    {% include 'staff_v2/menu_postlogin.html' %}
    <section class="section-wrapper listing-page">
        <div class="container">
            <div class="row align-center">
                <div class="col-12 col-sm-12 col-md-12 col-lg-6">
                    <div class="title">
                        <h2>Manage Links<br><span><a style="color:blue;text-decoration:underline;"
                                                          href="/staff/manage/links/create-link">Add Link</a></span>
                        </h2>
                    </div>
                </div>
                <div class="container grid-container">
                    <div class="row">
                        {% for link in object_list %}
                        <div class="col-12 col-md-6 col-lg-6">
                            <div class="card listing">
                                <div class="listing-text Doctorparoma-text">
                                    <h3>{{ link.title }}</h3>
                                    <p>{{ link.url }} </p>
                                    <div class="listing-button">
                                        <ul>
                                            <li>
                                                <button onclick="location.href='/staff/manage/links/edit-link/{{ link.id }}'">
                                                    <img src="{% static 'branding/edit.svg' %}"><span>Edit</span>
                                                </button>
                                            </li>
                                            <li>
                                                <button onclick="location.href='/staff/manage/links/delete-link/{{ link.id }}'">
                                                    <img src="{% static 'branding/delete.svg' %}"><span>Delete</span>
                                                </button>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
